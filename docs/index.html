<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Демо приложений доставки</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap">
<style>
  :root { --bg: #F5F4F2; --surface: #FFFFFF; --ink: #141414; --muted: #8B8884; --line: #EAE8E4; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Onest", system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 56px max(16px, env(safe-area-inset-left, 0px)) 56px; }
  h1 { font-weight: 600; font-size: 32px; letter-spacing: -.03em; margin: 0 0 8px; }
  p { color: var(--muted); line-height: 1.55; margin: 0 0 28px; }
  a.card { display: flex; align-items: center; gap: 16px; padding: 18px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); color: inherit; text-decoration: none; margin-bottom: 10px; }
  a.card:hover { border-color: var(--ink); }
  .mono { width: 44px; height: 44px; border-radius: 13px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-weight: 600; font-size: 19px; flex: none; }
  b { display: block; font-weight: 500; }
  small { color: var(--muted); }
  .go { margin-left: auto; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Демо приложений доставки</h1>
  <p>Каждое демо собрано под конкретное кафе: их меню, цены и фото. Лучше открывать с телефона.</p>
  <a class="card" href="imbir/"><span class="mono">И</span><span><b>Суши Имбирь</b><small>Ленск · 73 блюда</small></span><span class="go">→</span></a>
</main>
</body>
</html>
