<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Приложения доставки</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap">
<style>
  :root { --bg: #F5F4F2; --ink: #141414; --muted: #8B8884; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Onest", system-ui, sans-serif; display: grid; place-items: center; }
  main { max-width: 440px; padding: 24px max(16px, env(safe-area-inset-left, 0px)); text-align: center; }
  h1 { font-weight: 600; font-size: 26px; letter-spacing: -.03em; margin: 0 0 10px; }
  p { color: var(--muted); line-height: 1.55; margin: 0; }
</style>
</head>
<body>
<!-- No list of demos here on purpose: each cafe gets only its own link. -->
<main>
  <h1>Приложения доставки для кафе</h1>
  <p>Откройте ссылку на демо, которую мы вам прислали.</p>
</main>
</body>
</html>
