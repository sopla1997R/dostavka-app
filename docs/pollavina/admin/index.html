$("#cafeName").textContent = C.brand.name;
$("#appLink").href = C.appUrl || "../"; $("#appLink").innerHTML = ic("app");

const P = Object.fromEntries(C.products.map(p => [p.id, p]));
const appAbs = new URL(C.appUrl || "../", location.href).href;

/* ── state (kept in this browser; the live channel keeps the last 12 hours) ── */
const KEY = "cabinet:" + C.live.topic;
const saved = (() => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } })();
const S = { orders: saved.orders || {}, stop: new Set(saved.stop || []), open: saved.open !== false, sound: saved.sound !== false, tab: "orders", filter: "new", started: false };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ orders: S.orders, stop: [...S.stop], open: S.open, sound: S.sound })); } catch (e) {} };
// drop orders older than 2 days
Object.values(S.orders).forEach(o => { if (Date.now() - o.created > 2 * 864e5) delete S.orders[o.id]; });

/* ── transport ── */
const seen = new Set();
let bc = null; try { bc = new BroadcastChannel("zakaz-" + C.live.topic); bc.onmessage = e => onEvent(e.data, Date.now(), false); } catch (e) {}
function send(ev) {
  ev.u = Math.random().toString(36).slice(2, 12); seen.add(ev.u);
  try { bc && bc.postMessage(ev); } catch (e) {}
  return fetch("https://ntfy.sh/" + C.live.topic, { method: "POST", body: JSON.stringify(ev) }).then(r => r.ok).catch(() => false);
}
let replaying = true;
function connect() {
  const es = new EventSource("https://ntfy.sh/" + C.live.topic + "/sse?since=12h");
  es.addEventListener("open", () => setConn(true));
  es.onmessage = e => { try { const d = JSON.parse(e.data); if (d.event === "message") onEvent(JSON.parse(d.message), d.time * 1000, replaying); } catch (err) {} };
  es.onerror = () => setConn(false);
  // the cached part of the stream arrives at once; anything after this is live
  setTimeout(() => { replaying = false; render(); }, 2500);
}
function setConn(ok) { $("#conn").classList.toggle("off", !ok); $("#connText").textContent = ok ? "На связи" : "Нет связи, переподключаемся"; }

function onEvent(ev, at, old) {
  if (!ev || !ev.type || (ev.u && seen.has(ev.u))) return;
  if (ev.u) seen.add(ev.u);
  if (ev.type === "order" && ev.id && !S.orders[ev.id]) {
    S.orders[ev.id] = { ...ev, stage: 0, receivedAt: Date.now() };
    const fresh = !old && Date.now() - ev.created < 5 * 60000;
    if (fresh) { S.orders[ev.id].fresh = true; ding(); toast("Новый заказ №" + ev.num + " · " + rub(ev.total)); }
    save(); render();
  } else if (ev.type === "status" && S.orders[ev.id]) {
    const o = S.orders[ev.id];
    if (ev.stage < 0) { o.cancelled = true; o.reason = ev.reason || ""; } else o.stage = Math.max(o.stage, ev.stage);
    if (ev.eta) o.eta = ev.eta;
    save(); render();
  } else if (ev.type === "menu") {
    S.stop = new Set(ev.stop || []); S.open = ev.open !== false; save(); render();
  }
}

/* ── sound: a soft two-note chime (browsers allow it after the first tap) ── */
let actx = null;
function ding() {
  if (!S.sound || !S.started) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    [[880, 0], [1320, .18], [880, .7], [1320, .88]].forEach(([f, t]) => {
      const o = actx.createOscillator(), g = actx.createGain(); o.type = "sine"; o.frequency.value = f;
      const s = actx.currentTime + t; g.gain.setValueAtTime(0, s); g.gain.linearRampToValueAtTime(.25, s + .02); g.gain.exponentialRampToValueAtTime(.001, s + .45);
      o.connect(g).connect(actx.destination); o.start(s); o.stop(s + .5);
    });
  } catch (e) {}
}
setInterval(() => { if (Object.values(S.orders).some(o => !o.cancelled && o.stage === 0)) ding(); }, 30000);   // reminder while orders wait
setInterval(() => { if (S.started) send({ type: "hello" }); }, 4 * 60000);   // tells the app the cabinet is open

let toastT;
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2600); }

/* ── orders ── */
const isDel = o => o.mode !== "pickup";
const STEP = o => isDel(o) ? ["Новый", "Готовится", "Курьер в пути", "Доставлен"] : ["Новый", "Готовится", "Готов к выдаче", "Выдан"];
const NEXT = o => isDel(o) ? [null, "Передать курьеру", "Доставлен"] : [null, "Готов к выдаче", "Выдан"];
const group = o => o.cancelled || o.stage >= 3 ? "done" : o.stage === 0 ? "new" : "work";
const ago = t => { const m = Math.floor((Date.now() - t) / 60000); return m < 1 ? "только что" : m < 60 ? m + " мин назад" : hhmm(t); };
const etaPick = {};   // order id → minutes chosen before accepting

function orderCard(o) {
  const g = group(o), del = isDel(o);
  const wait = g === "new" ? Math.floor((Date.now() - o.created) / 60000) : 0;
  const addr = [o.addr, o.flat && "кв. " + o.flat, o.ent].filter(Boolean).join(", ");
  let acts = "";
  if (!o.cancelled && o.stage === 0) {
    const mins = etaPick[o.id];
    acts = `<div class="chips">${del ? "Привезём через" : "Будет готово через"} ${(del ? [30, 45, 60, 90] : [15, 20, 30, 45]).map(m => `<button data-eta="${o.id}" data-m="${m}" class="${mins === m ? "on" : ""}">${m} мин</button>`).join("")}</div>
      <div class="acts"><button class="btn wide" data-go="${o.id}" data-st="1">Принять заказ</button><button class="btn ghost" data-cancel="${o.id}">Отклонить</button></div>
      <div class="reasons" id="rs-${o.id}" hidden><p>Причина отказа увидит клиент:</p><div class="chips">${["Закончились продукты", "Не доставляем по этому адресу", "Слишком много заказов", "Клиент попросил отменить"].map(r => `<button data-reason="${o.id}" data-r="${esc(r)}">${esc(r)}</button>`).join("")}</div></div>`;
  } else if (!o.cancelled && o.stage < 3) {
    acts = `<div class="acts"><button class="btn wide" data-go="${o.id}" data-st="${o.stage + 1}">${NEXT(o)[o.stage]}</button><button class="btn ghost" data-cancel="${o.id}">Отменить</button></div>
      <div class="reasons" id="rs-${o.id}" hidden><p>Причина отмены увидит клиент:</p><div class="chips">${["Закончились продукты", "Курьер не может доехать", "Клиент попросил отменить"].map(r => `<button data-reason="${o.id}" data-r="${esc(r)}">${esc(r)}</button>`).join("")}</div></div>`;
  } else acts = `<div class="final">${o.cancelled ? "Отменён" + (o.reason ? ": " + esc(o.reason) : "") : STEP(o)[3] + (o.doneAt ? " в " + hhmm(o.doneAt) : "")}</div>`;
  return `<article class="oc${o.fresh && g === "new" && Date.now() - o.receivedAt < 60000 ? " fresh" : ""}${g === "done" ? " done" : ""}" data-id="${o.id}">
    <div class="oh"><b class="num">№${o.num}</b><span class="badge${del ? "" : " pick"}">${del ? "Доставка" : "Самовывоз"}</span>${o.cancelled ? `<span class="badge cancel">Отменён</span>` : g !== "new" ? `<span class="badge">${STEP(o)[o.stage]}</span>` : ""}<span class="ago${wait >= 3 ? " late" : ""}">${wait >= 1 ? "ждёт " + wait + " мин" : "в " + hhmm(o.created)}</span></div>
    <div class="when">${o.asap ? "Как можно скорее" : "Ко времени"} · <b>${del ? "привезти к" : "забрать в"} ${esc(o.eta)}</b></div>
    <ul class="items">${(o.lines || []).map(l => `<li><span class="q num">${l.q} ×</span><span class="n">${esc(l.name)}${l.opts ? `<small>${esc(l.opts)}</small>` : ""}</span><span class="num">${rub(l.sum)}</span></li>`).join("")}</ul>
    <div class="sum"><span>${ic("card")} ${esc(o.pay || "")}${o.discount ? ` · скидка ${rub(o.discount)}` : ""}${o.fee ? ` · доставка ${rub(o.fee)}` : ""}</span><b class="num">${rub(o.total)}</b></div>
    <div class="cust">
      <div class="row">${ic("user")}<span>${esc(o.name || "Без имени")} · <a href="tel:${esc(String(o.phone || "").replace(/[^\d+]/g, ""))}">${esc(o.phone || "")}</a></span></div>
      ${del && addr ? `<div class="row">${ic("pin")}<span>${esc(addr)}</span></div>` : ""}
    </div>
    ${o.note ? `<div class="memo">${esc(o.note)}</div>` : ""}
    ${acts}
  </article>`;
}

function emptyNew() {
  return `<div class="empty"><b>Новых заказов нет</b>Откройте приложение на телефоне и оформите заказ: он появится здесь со звуком.</div>`;
}
function renderOrders() {
  const all = Object.values(S.orders).sort((a, b) => b.created - a.created);
  const by = { new: [], work: [], done: [] };
  all.forEach(o => by[group(o)].push(o));
  by.new.sort((a, b) => a.created - b.created);
  const head = (k, t) => `<h3>${t}${by[k].length ? ` <span class="cnt${k === "new" ? "" : " dim"}">${by[k].length}</span>` : ""}</h3>`;
  const col = (k, t, empty) => `<div class="col" data-col="${k}" ${S.filter === k ? "" : "hidden"}>${head(k, t)}<div class="stack">${by[k].length ? by[k].map(orderCard).join("") : empty}</div></div>`;
  $("#v-orders").innerHTML = `
    <div class="filters">${[["new", "Новые"], ["work", "В работе"], ["done", "Завершённые"]].map(([k, t]) => `<button data-filter="${k}" class="${S.filter === k ? "on" : ""}">${t}${by[k].length ? ` <span class="cnt${k === "new" ? "" : " dim"}">${by[k].length}</span>` : ""}</button>`).join("")}</div>
    <div class="board">
      ${col("new", "Новые", emptyNew())}
      ${col("work", "В работе", `<div class="empty">Принятые заказы будут здесь</div>`)}
      ${col("done", "Завершённые", `<div class="empty">Здесь будут выполненные и отменённые заказы</div>`)}
    </div>`;
  const n = by.new.length;
  $("#newCnt").hidden = !n; $("#newCnt").textContent = n;
  document.title = (n ? `(${n}) ` : "") + "Кабинет · " + C.brand.name;
}

/* ── menu / stop-list ── */
let q = "";
function renderMenu() {
  const match = p => !q || p.name.toLowerCase().includes(q);
  $("#v-menu").innerHTML = `
    <div class="tools"><label class="search">${ic("search")}<input id="ms" type="search" placeholder="Найти блюдо" value="${esc(q)}" autocomplete="off"></label>
      <span class="stopinfo">${S.stop.size ? `В стоп-листе: ${S.stop.size}` : "Всё в наличии"}</span>${S.stop.size ? `<button class="btn line" data-clearstop>Вернуть всё</button>` : ""}</div>
    ${C.categories.map(c => { const ps = C.products.filter(p => p.cat === c.id && match(p)); return ps.length ? `<div class="cat"><h3>${esc(c.name)}</h3><div class="plist">${ps.map(p => { const off = S.stop.has(p.id); return `<button class="pr${off ? " off" : ""}" data-stop="${p.id}">${p.img ? `<img src="${esc(p.img)}" alt="" loading="lazy">` : `<span class="ph"></span>`}<span class="t"><b>${esc(p.name)}</b><small class="num">${rub(p.sizes ? p.sizes[0].price : p.price)}</small></span><span class="st">${off ? "Нет в наличии" : "В наличии"}</span><span class="sw${off ? "" : " on"}"></span></button>`; }).join("")}</div></div>` : ""; }).join("")}
    <p class="about">Блюдо из стоп-листа сразу пропадает из заказа у клиентов: в приложении на нём «Нет в наличии».</p>`;
  const ms = $("#ms"); ms.oninput = () => { q = ms.value.trim().toLowerCase(); const pos = ms.selectionStart; renderMenu(); const m2 = $("#ms"); m2.focus(); m2.setSelectionRange(pos, pos); };
  $("#stopCnt").hidden = !S.stop.size; $("#stopCnt").textContent = S.stop.size;
}

/* ── today ── */
function renderStats() {
  const day = new Date().toDateString();
  const today = Object.values(S.orders).filter(o => new Date(o.created).toDateString() === day);
  const ok = today.filter(o => !o.cancelled), rev = ok.reduce((a, o) => a + o.total, 0);
  const top = {}; ok.forEach(o => (o.lines || []).forEach(l => { top[l.name] = (top[l.name] || 0) + l.q; }));
  const topList = Object.entries(top).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const del = ok.filter(isDel).length;
  $("#v-stats").innerHTML = `
    <div class="kpis">
      <div class="kpi"><small>Заказов</small><b class="num">${ok.length}</b></div>
      <div class="kpi"><small>Выручка</small><b class="num">${rub(rev)}</b></div>
      <div class="kpi"><small>Средний чек</small><b class="num">${ok.length ? rub(rev / ok.length) : "—"}</b></div>
      <div class="kpi"><small>Отменено</small><b class="num">${today.length - ok.length}</b></div>
    </div>
    <div class="panel"><h3>Как заказывали</h3>
      <div class="line"><span>Доставка</span><b class="num">${del}</b></div>
      <div class="line"><span>Самовывоз</span><b class="num">${ok.length - del}</b></div>
    </div>
    <div class="panel"><h3>Популярное сегодня</h3>
      ${topList.length ? topList.map(([n, c]) => `<div class="line"><span>${esc(n)}</span><b class="num">${c} шт.</b></div>`).join("") : `<div class="line"><span>Пока нет заказов</span><b></b></div>`}
    </div>
    <div class="panel about"><h3 style="color:var(--ink)">Это демо-кабинет</h3>
      <p>Здесь показано, как кафе принимает заказы из своего приложения. В рабочей версии добавим:</p>
      <ul><li>вход по паролю для сотрудников</li><li>уведомления о заказах в Telegram</li><li>историю заказов и отчёты за любой период</li><li>редактирование меню, цен и фото</li><li>онлайн-оплату и связку с кассой, если нужно</li></ul>
    </div>`;
}

function render() {
  renderOrders();
  if (S.tab === "menu") renderMenu(); else { $("#stopCnt").hidden = !S.stop.size; $("#stopCnt").textContent = S.stop.size; }
  if (S.tab === "stats") renderStats();
  const sw = $("#openSw"); sw.classList.toggle("on", S.open); sw.classList.toggle("paused", !S.open);
  $(".lbl", sw).textContent = S.open ? "Принимаем заказы" : "Приём на паузе";
  $("#pauseNote").hidden = S.open;
  const sb = $("#soundBtn"); sb.classList.toggle("on", S.sound); sb.innerHTML = ic(S.sound ? "bell" : "bellOff");
}
function publishMenu() { save(); render(); send({ type: "menu", stop: [...S.stop], open: S.open }); }

function setStage(id, st, extra = {}) {
  const o = S.orders[id]; if (!o) return;
  const ev = { type: "status", id, stage: st, ...extra };
  if (st === 1) {
    const m = etaPick[id];
    if (m) { o.eta = hhmm(Date.now() + m * 60000); ev.eta = o.eta; }
  }
  if (st < 0) { o.cancelled = true; o.reason = extra.reason || ""; } else o.stage = st;
  if (st >= 3 || st < 0) o.doneAt = Date.now();
  o.fresh = false; save(); render();
  send(ev).then(okk => { if (!okk) toast("Не удалось отправить статус клиенту, проверьте интернет"); });
  toast(st < 0 ? "Заказ №" + o.num + " отменён" : "Заказ №" + o.num + ": " + STEP(o)[st].toLowerCase());
}

document.addEventListener("click", e => {
  const t = e.target; let b;
  if ((b = t.closest("[data-tab]"))) { S.tab = b.dataset.tab; $$("#tabs button").forEach(x => x.classList.toggle("on", x === b)); ["orders", "menu", "stats"].forEach(k => { $("#v-" + k).hidden = k !== S.tab; }); render(); scrollTo(0, 0); return; }
  if ((b = t.closest("[data-filter]"))) { S.filter = b.dataset.filter; renderOrders(); return; }
  if ((b = t.closest("[data-eta]"))) { const id = b.dataset.eta, m = +b.dataset.m; etaPick[id] = etaPick[id] === m ? undefined : m; renderOrders(); return; }
  if ((b = t.closest("[data-go]"))) { setStage(b.dataset.go, +b.dataset.st); return; }
  if ((b = t.closest("[data-cancel]"))) { const r = $("#rs-" + b.dataset.cancel); if (r) r.hidden = !r.hidden; return; }
  if ((b = t.closest("[data-reason]"))) { setStage(b.dataset.reason, -1, { reason: b.dataset.r }); return; }
  if ((b = t.closest("[data-stop]"))) { const id = b.dataset.stop; if (S.stop.has(id)) S.stop.delete(id); else S.stop.add(id); publishMenu(); toast(P[id].name + (S.stop.has(id) ? ": в стоп-листе" : ": снова в наличии")); return; }
  if (t.closest("[data-clearstop]")) { S.stop.clear(); publishMenu(); return; }
  if (t.closest("#openSw")) { S.open = !S.open; publishMenu(); toast(S.open ? "Приём заказов включён" : "Приём заказов на паузе"); return; }
  if (t.closest("#soundBtn")) { S.sound = !S.sound; save(); render(); if (S.sound) ding(); return; }
});
setInterval(() => { if (S.tab === "orders") renderOrders(); }, 30000);   // keeps "ждёт N мин" fresh

/* ── start of shift: one tap unlocks sound in the browser ── */
function showStart() {
  const st = $("#start");
  st.innerHTML = `<div class="card">
    <div class="mono">${esc(C.brand.monogram || C.brand.name[0])}</div>
    <h1>Кабинет ${esc(C.brand.name)}</h1>
    <p>Сюда приходят заказы из вашего приложения. Здесь вы принимаете их, меняете статусы и ставите блюда в стоп-лист.</p>
    <ol><li>Нажмите «Начать смену», чтобы включить звук новых заказов.</li><li>Откройте приложение на телефоне и сделайте заказ.</li><li>Примите его здесь: клиент сразу увидит статус у себя.</li></ol>
    <div class="link">${esc(appAbs)}</div>
    <button class="btn" id="go">Начать смену</button>
  </div>`;
  st.hidden = false;
  $("#go").onclick = () => {
    S.started = true; st.hidden = true;
    try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch (e) {}
    send({ type: "hello" });
    send({ type: "menu", stop: [...S.stop], open: S.open });
  };
}

render();
connect();
showStart();
})();
</script>
</body>
</html>
