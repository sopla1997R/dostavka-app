h1, h2, h3 { font-weight: 600; letter-spacing: -.02em; margin: 0; text-wrap: balance; }

/* ── Stage ── */
.stage { position: fixed; inset: 0; display: grid; grid-template-columns: minmax(0, 420px) auto; justify-content: center; align-items: center; gap: clamp(48px, 7vw, 120px); padding: 24px max(24px, env(safe-area-inset-right, 0px)) 24px max(24px, env(safe-area-inset-left, 0px)); overflow: auto; }

.pitch { display: flex; flex-direction: column; gap: 24px; min-width: 0; }
.pitch .eyebrow { display: inline-flex; align-self: flex-start; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: var(--muted); }
.pitch .eyebrow i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.pitch h1 { font-size: clamp(30px, 3vw, 42px); line-height: 1.08; letter-spacing: -.035em; }
.pitch p.lead { font-size: 16px; line-height: 1.6; color: var(--muted); margin: 0; max-width: 42ch; }
.pitch ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.pitch li { display: flex; gap: 12px; align-items: flex-start; font-size: 15px; line-height: 1.45; }
.pitch li .ck { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line); background: var(--surface); flex: none; margin-top: -1px; }
.pitch li .ck svg { width: 12px; height: 12px; stroke-width: 2.4; }
.pitch .try { display: flex; align-items: center; gap: 12px; font-weight: 500; font-size: 15px; padding: 16px 18px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
.pitch .try svg { margin-left: auto; width: 18px; height: 18px; }
.pitch .contact { font-size: 14px; color: var(--muted); }
.pitch .contact b { color: var(--ink); font-weight: 500; }

/* ── Phone frame ── */
.phone { position: relative; width: 390px; height: min(840px, calc(100vh - 48px)); min-height: 600px; border-radius: 52px; background: var(--bg); overflow: hidden; isolation: isolate;
  box-shadow: 0 0 0 10px #111, 0 0 0 11px #2A2A2A, 0 40px 80px -30px rgba(0, 0, 0, .45); }
.sbar { position: absolute; top: 0; left: 0; right: 0; height: 48px; z-index: 40; display: flex; align-items: center; justify-content: space-between; padding: 6px 30px 0 34px; font-weight: 600; font-size: 15px; pointer-events: none; }
.sbar .island { position: absolute; left: 50%; top: 11px; transform: translateX(-50%); width: 110px; height: 31px; border-radius: 20px; background: #111; }
.sbar .ic { display: flex; gap: 6px; align-items: center; }
.sbar .ic svg { width: 16px; height: 16px; fill: currentColor; stroke: none; }
.app { position: absolute; inset: 0; padding-top: 48px; display: flex; flex-direction: column; }

@media (max-width: 899px) {
  body { background: var(--bg); }
  .stage { display: block; padding: 0; overflow: hidden; }
  .stage > .pitch, .sbar { display: none; }
  .phone { width: 100%; height: 100%; min-height: 0; border-radius: 0; box-shadow: none; }
  .app { padding-top: env(safe-area-inset-top, 0px); }
}

/* ── Views ── */
.views { position: relative; flex: 1; min-height: 0; }
.view { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; padding-bottom: calc(160px + env(safe-area-inset-bottom, 0px)); scrollbar-width: none; animation: fadeIn .3s var(--ease); }
.view::-webkit-scrollbar { display: none; }
.pad { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Header */
.top { display: flex; align-items: center; gap: 12px; padding-top: 10px; padding-bottom: 4px; }
.mono { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--ink); color: var(--bg); font-weight: 600; font-size: 18px; flex: none; overflow: hidden; }
.mono img { width: 100%; height: 100%; object-fit: cover; }
.brandname { font-weight: 600; font-size: 17px; letter-spacing: -.01em; line-height: 1.2; }
.brandsub { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; margin-top: 1px; }
.brandsub .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
.brandsub .dot.off { background: var(--muted); }
.iconbtn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); position: relative; flex: none; transition: transform .15s; }
.iconbtn:active { transform: scale(.94); }
.iconbtn svg { width: 20px; height: 20px; }
.ml-auto { margin-left: auto; }

.demo-ribbon { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; width: 100%; text-align: left; }
.demo-ribbon i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; }
.demo-ribbon span { color: var(--muted); margin-left: auto; }
@media (min-width: 900px) { .demo-ribbon { display: none; } }

.mode { display: grid; grid-template-columns: 1fr 1fr; padding: 3px; border-radius: 12px; background: color-mix(in srgb, var(--ink) 6%, var(--bg)); margin-top: 14px; position: relative; }
.mode button { position: relative; z-index: 1; height: 36px; border-radius: 10px; font-weight: 500; font-size: 14px; color: var(--muted); transition: color .2s; }
.mode button.on { color: var(--ink); }
.mode .knob { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px); border-radius: 10px; background: var(--surface); box-shadow: 0 1px 3px rgba(0, 0, 0, .1); transition: transform .3s var(--ease); }
.mode.pickup .knob { transform: translateX(100%); }
.addr { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 13px; color: var(--muted); }
.addr svg { width: 16px; height: 16px; }
.addr b { color: var(--ink); font-weight: 500; }

.hello { margin-top: 22px; }
.hello small { display: block; color: var(--muted); font-size: 14px; }
.hello h1 { font-size: 28px; line-height: 1.15; margin-top: 2px; }

.search { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 14px; margin-top: 16px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
.search svg { width: 18px; height: 18px; }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 15px; color: var(--ink); }
.search input::placeholder { color: var(--muted); }

/* Active order strip */
.live { display: flex; align-items: center; gap: 12px; margin-top: 14px; padding: 12px 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); width: 100%; text-align: left; }
.live .lv-ic { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--soft); flex: none; position: relative; }
.live .lv-ic::after { content: ""; position: absolute; top: 2px; right: 2px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); border: 2px solid var(--surface); }
.live .lv-ic svg { width: 18px; height: 18px; }
.live b { display: block; font-size: 14px; font-weight: 600; }
.live small { color: var(--muted); font-size: 12.5px; }
.live > svg { margin-left: auto; color: var(--muted); width: 18px; height: 18px; }

/* Stories */
.stories { display: flex; gap: 12px; overflow-x: auto; padding-top: 20px; scrollbar-width: none; }
.stories::-webkit-scrollbar { display: none; }
.story { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: none; width: 72px; }
.story .ring, .story .in { display: block; }
.story .ring { width: 70px; height: 70px; border-radius: 50%; padding: 2px; border: 1.5px solid var(--accent); transition: transform .2s, border-color .3s; }
.story.seen .ring { border-color: var(--line); }
.story .in { width: 100%; height: 100%; border-radius: 50%; overflow: hidden; background: var(--surface); }
.story .in img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.35); }
.story span { font-size: 12px; color: var(--ink); text-align: center; line-height: 1.25; }
.story:active .ring { transform: scale(.95); }

/* Banners */
.banners { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; padding-top: 18px; scrollbar-width: none; scroll-padding: 0 16px; }
.banners::-webkit-scrollbar { display: none; }
.banner { scroll-snap-align: start; flex: none; width: calc(100% - 48px); height: 148px; border-radius: var(--r); padding: 18px; position: relative; overflow: hidden; text-align: left; display: flex; flex-direction: column; justify-content: space-between; background: var(--b, var(--surface)); color: var(--ink); }
.banner:first-child { margin-left: max(16px, env(safe-area-inset-left, 0px)); }
.banner:last-child { margin-right: max(16px, env(safe-area-inset-right, 0px)); }
.banner h3 { font-size: 19px; line-height: 1.15; max-width: 58%; position: relative; z-index: 1; }
.banner p { margin: 6px 0 0; font-size: 13px; color: color-mix(in srgb, var(--ink) 65%, transparent); max-width: 52%; line-height: 1.35; position: relative; z-index: 1; }
.banner .go { align-self: flex-start; font-size: 12.5px; font-weight: 500; display: inline-flex; align-items: center; gap: 4px; position: relative; z-index: 1; }
.banner .go svg { width: 14px; height: 14px; }
/* photo fills the right side and fades into the banner, so both white-background and dark photos sit well */
.banner .bimg { position: absolute; right: 0; top: 0; width: 50%; height: 100%; mix-blend-mode: multiply; -webkit-mask-image: linear-gradient(to right, transparent, #000 38%); mask-image: linear-gradient(to right, transparent, #000 38%); }
.banner .bimg img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s var(--ease); }
.banner:hover .bimg img { transform: scale(1.04); }
.dots { display: flex; gap: 5px; justify-content: center; margin-top: 10px; }
.dots i { width: 5px; height: 5px; border-radius: 5px; background: var(--line); transition: width .3s, background .3s; }
.dots i.on { width: 16px; background: var(--ink); }

/* Category chips */
.chips { position: sticky; top: 0; z-index: 5; display: flex; gap: 6px; overflow-x: auto; padding-top: 10px; padding-bottom: 10px; margin-top: 12px; background: var(--bg); scrollbar-width: none; transition: box-shadow .2s; }
.chips::-webkit-scrollbar { display: none; }
.chips.stuck { box-shadow: 0 1px 0 var(--line); }
.chip { flex: none; height: 36px; padding: 0 14px; border-radius: 10px; font-weight: 500; font-size: 14px; color: var(--muted); transition: background .2s, color .2s; }
.chip.on { background: var(--ink); color: var(--bg); }

/* Menu sections + cards */
.section h2 { font-size: 21px; margin: 20px 0 12px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.card { background: var(--surface); border-radius: var(--r); overflow: hidden; display: flex; flex-direction: column; text-align: left; position: relative; min-width: 0; transition: transform .2s var(--ease), box-shadow .2s; }
.card:active { transform: scale(.98); }
@media (hover: hover) { .card:hover { box-shadow: 0 8px 24px -14px rgba(0, 0, 0, .25); } }
.ph { position: relative; aspect-ratio: 4 / 3; max-width: 100%; background: #fff; overflow: hidden; display: grid; place-items: center; }
.ph img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s var(--ease); }
@media (hover: hover) { .card:hover .ph img { transform: scale(1.05); } }
.ph-empty { background: var(--soft); }
.ph-empty span { font-size: 34px; font-weight: 600; color: color-mix(in srgb, var(--ink) 18%, transparent); }
.tags { position: absolute; top: 8px; left: 8px; display: flex; flex-wrap: wrap; gap: 4px; z-index: 1; }
.tag { font-size: 11px; font-weight: 500; padding: 3px 7px; border-radius: 6px; background: var(--glass); backdrop-filter: blur(6px); color: var(--ink); border: 1px solid var(--line); }
.tag.hot::before { content: ""; display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); margin-right: 5px; vertical-align: 1px; }
.qbadge { position: absolute; top: 8px; right: 8px; z-index: 1; min-width: 22px; height: 22px; border-radius: 11px; display: grid; place-items: center; padding: 0 6px; font-weight: 600; font-size: 12px; background: var(--ink); color: var(--bg); animation: pop .3s var(--ease); }
.card .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 3px; flex: 1; }
.card .nm { font-weight: 500; font-size: 14.5px; line-height: 1.3; }
.card .wt { font-size: 12px; color: var(--muted); }
.card .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; padding-top: 10px; }
.card .pr { font-weight: 600; font-size: 15px; white-space: nowrap; }
.card .pr s { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 4px; }
.plus { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--soft); color: var(--ink); flex: none; transition: background .2s, color .2s, transform .15s; }
.plus svg { width: 18px; height: 18px; stroke-width: 2; }
.plus:hover { background: var(--ink); color: var(--bg); }
.plus:active { transform: scale(.9); }
.stepper { display: flex; align-items: center; height: 34px; border-radius: 17px; background: var(--ink); color: var(--bg); font-weight: 600; font-size: 14px; animation: pop .25s var(--ease); }
.stepper button { width: 32px; height: 34px; display: grid; place-items: center; color: inherit; }
.stepper button svg { width: 16px; height: 16px; stroke-width: 2; }
.stepper span { min-width: 16px; text-align: center; }
.stepper.light { background: var(--soft); color: var(--ink); }
.stepper.lg { height: 48px; border-radius: 14px; }
.stepper.lg button { width: 44px; height: 48px; }
.empty-search { text-align: center; color: var(--muted); padding: 40px 0; }

/* Floating cart pill + tab bar */
.pill { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); z-index: 20; height: 54px; border-radius: 16px; background: var(--primary); color: var(--on-primary); display: flex; align-items: center; gap: 12px; padding: 0 8px 0 16px; font-weight: 500; box-shadow: 0 14px 30px -14px rgba(0, 0, 0, .5); transform: translateY(220%); opacity: 0; pointer-events: none; transition: transform .4s var(--ease), opacity .25s; }
.pill.show { transform: none; opacity: 1; pointer-events: auto; }
.pill .t { font-size: 14px; }
.pill .t small { display: block; font-size: 12px; opacity: .6; font-weight: 400; }
.pill .sum { margin-left: auto; height: 38px; padding: 0 14px; border-radius: 11px; display: flex; align-items: center; background: color-mix(in srgb, var(--on-primary) 14%, transparent); font-weight: 600; }
.pill.bump { animation: bump .4s var(--ease); }

.tabbar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 21; padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); background: var(--glass); backdrop-filter: blur(20px) saturate(1.5); -webkit-backdrop-filter: blur(20px) saturate(1.5); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr); }
.phone:not(.mob) .tabbar { padding-bottom: 20px; }
.tab { height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: var(--muted); position: relative; transition: color .2s; }
.tab svg { width: 23px; height: 23px; }
.tab.on { color: var(--ink); }
.tab.on svg { stroke-width: 2; }
.badge { min-width: 17px; height: 17px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: #fff; font-size: 10.5px; font-weight: 600; display: grid; place-items: center; }
.tab .badge { position: absolute; top: 3px; left: 50%; margin-left: 5px; }
.badge.pop { animation: pop .35s var(--ease); }

/* Page titles + blocks */
.ptitle { font-size: 28px; margin: 18px 0 4px; }
.psub { color: var(--muted); font-size: 14px; margin: 0 0 18px; }
.block { background: var(--surface); border-radius: var(--r); padding: 16px; }
.stack { display: grid; gap: 10px; }
.h3 { font-size: 17px; margin: 26px 0 12px; }

/* Promo view */
.promo-big { width: 100% !important; margin: 0 !important; height: 160px; }
.code { display: flex; align-items: center; gap: 14px; }
.code .c { font-weight: 600; font-size: 14px; padding: 9px 12px; border-radius: 10px; border: 1px dashed color-mix(in srgb, var(--ink) 35%, transparent); letter-spacing: .04em; }
.code p { margin: 0; font-size: 13.5px; color: var(--muted); flex: 1; min-width: 0; line-height: 1.4; }
.btn-s { height: 36px; padding: 0 14px; border-radius: 10px; background: var(--ink); color: var(--bg); font-weight: 500; font-size: 13px; flex: none; }

/* Cart */
.free .row { display: flex; justify-content: space-between; font-size: 14px; gap: 10px; }
.free .row span:first-child { color: var(--muted); }
.bar { height: 4px; border-radius: 4px; background: var(--line); margin-top: 12px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 4px; background: var(--ink); transition: width .6s var(--ease); }
.line { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.line:last-child { border-bottom: 0; }
.line .ph { width: 68px; flex: none; border-radius: 12px; aspect-ratio: 1 / 1; }
.line .ph-empty span { font-size: 20px; }
.line .info { flex: 1; min-width: 0; display: grid; gap: 2px; }
.line .info b { font-size: 14.5px; font-weight: 500; }
.line .info small { color: var(--muted); font-size: 12.5px; }
.line .info .pr { font-weight: 600; font-size: 14px; margin-top: 2px; }
.hscroll { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.hscroll::-webkit-scrollbar { display: none; }
.mini { flex: none; width: 132px; background: var(--surface); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; text-align: left; }
.mini .ph { aspect-ratio: 1 / 1; }
.mini .mb { padding: 8px 10px 10px; display: grid; gap: 6px; }
.mini b { font-size: 13px; font-weight: 500; line-height: 1.25; min-height: 2.5em; }
.mini .addbtn { height: 32px; border-radius: 9px; background: var(--soft); font-size: 13px; font-weight: 600; transition: background .2s, color .2s; }
.mini .addbtn:hover { background: var(--ink); color: var(--bg); }
.field { display: flex; gap: 8px; }
.field input { flex: 1; min-width: 0; height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: 0 14px; font-weight: 500; outline: 0; text-transform: uppercase; letter-spacing: .03em; }
.field input::placeholder { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--muted); }
.field input:focus { border-color: var(--ink); }
.field .btn-s { height: 46px; border-radius: 12px; }
.ok-note { color: var(--ok); font-size: 13px; margin-top: 8px; }
.err-note { color: #C2405A; font-size: 13px; margin-top: 8px; }
.toggle { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; }
.toggle .sw { margin-left: auto; width: 46px; height: 28px; border-radius: 14px; background: var(--line); position: relative; transition: background .25s; flex: none; }
.toggle .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, .2); transition: transform .3s var(--ease); }
.toggle.on .sw { background: var(--ink); }
.toggle.on .sw::after { transform: translateX(18px); }
.toggle b { display: block; font-size: 14.5px; font-weight: 500; }
.toggle small { color: var(--muted); font-size: 12.5px; }
.sum-row { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); padding: 5px 0; }
.sum-row b { color: var(--ink); font-weight: 500; }
.sum-total { display: flex; justify-content: space-between; align-items: baseline; padding-top: 12px; margin-top: 8px; border-top: 1px solid var(--line); font-weight: 600; font-size: 19px; letter-spacing: -.01em; }
.cta { width: 100%; height: 54px; border-radius: 16px; background: var(--primary); color: var(--on-primary); font-weight: 500; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 10px; transition: transform .15s, opacity .2s; }
.cta:active { transform: scale(.985); }
.cta[disabled] { opacity: .35; cursor: not-allowed; }
.empty { text-align: center; padding: 70px 24px 0; display: grid; justify-items: center; gap: 8px; }
.empty .eic { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); margin-bottom: 8px; }
.empty .eic svg { width: 30px; height: 30px; }
.empty h3 { font-size: 20px; }
.empty p { color: var(--muted); margin: 0 0 14px; max-width: 28ch; line-height: 1.5; }
.empty .cta { max-width: 240px; }

/* Bonus */
.loyal { position: relative; overflow: hidden; border-radius: 22px; padding: 20px; color: #fff; min-height: 196px; display: flex; flex-direction: column; background: #161616;
  background-image: radial-gradient(90% 120% at 100% 0%, color-mix(in srgb, var(--accent) 30%, transparent), transparent 60%), linear-gradient(160deg, #222 0%, #111 100%); }
.loyal .lv { font-size: 12.5px; opacity: .65; display: flex; justify-content: space-between; }
.loyal .bal { font-weight: 600; font-size: 44px; letter-spacing: -.04em; line-height: 1; margin-top: 22px; }
.loyal .bal small { font-size: 15px; font-weight: 400; margin-left: 6px; letter-spacing: 0; opacity: .7; }
.loyal .bc { margin-top: auto; padding-top: 20px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.barcode { height: 38px; width: 150px; border-radius: 6px; background: #fff; padding: 5px 8px; display: flex; gap: 1.5px; align-items: stretch; }
.barcode i { background: #111; flex: none; }

const imgOf = x => !x ? "" : P[x] ? (P[x].img || "") : x;   // a product id or a path
const monoHTML = (cls = "mono") => `<div class="${cls}">${C.brand.logoImg ? `<img src="${esc(C.brand.logoImg)}" alt="">` : esc(C.brand.monogram || C.brand.name[0])}</div>`;
const photo = (p, cls = "") => p.img
  ? `<div class="ph ${cls}"><img src="${esc(p.img)}" alt="" loading="lazy" decoding="async"></div>`
  : `<div class="ph ph-empty ${cls}"><span>${esc(p.name[0])}</span></div>`;
const extrasOf = p => typeof p.extras === "string" ? ((C.extras || {})[p.extras] || []) : (p.extras || []);
const basePrice = p => p.sizes ? p.sizes[0].price : p.price;
const hasOptions = p => !!((p.sizes && p.sizes.length > 1) || extrasOf(p).length);
const weightOf = p => p.sizes ? p.sizes[0].weight : p.weight;
const pickupLabel = () => "Самовывоз" + (D.pickupDiscount ? " −" + D.pickupDiscount + "%" : "");
const lineKey = (id, s, x) => id + "|" + s + "|" + x.slice().sort().join(",");
const linePrice = l => { const p = P[l.id]; const ex = extrasOf(p); return (p.sizes ? p.sizes[l.s].price : p.price) + l.x.reduce((a, i) => a + (ex[i] ? ex[i].price : 0), 0); };
const qtyOf = id => Object.values(S.cart).filter(l => l.id === id).reduce((a, l) => a + l.q, 0);
const level = () => { const lv = C.bonus.levels; let cur = lv[0]; lv.forEach(l => { if (S.spent >= l.from) cur = l; }); return cur; };

function totals() {
  const lines = Object.values(S.cart);
  const sub = lines.reduce((a, l) => a + linePrice(l) * l.q, 0);
  const count = lines.reduce((a, l) => a + l.q, 0);
  const pickupDisc = S.mode === "pickup" ? Math.round(sub * (D.pickupDiscount || 0) / 100) : 0;
  let promoDisc = 0, promoErr = "";
  const pr = S.promo && C.promocodes.find(x => x.code === S.promo);
  if (pr) {
    if (pr.min && sub < pr.min) promoErr = "Промокод работает от " + rub(pr.min);
    else promoDisc = pr.percent ? Math.round((sub - pickupDisc) * pr.percent / 100) : Math.min(pr.amount, sub - pickupDisc);
  }
  const fee = S.mode === "delivery" && sub > 0 && sub < D.freeFrom ? D.price : 0;
  const base = Math.max(0, sub - pickupDisc - promoDisc);
  const bonusMax = Math.floor(base * C.bonus.maxSpendPercent / 100);
  const bonusSpend = S.useBonus ? Math.min(S.bonus, bonusMax) : 0;
  const total = base - bonusSpend + fee;
  return { sub, count, pickupDisc, promoDisc, promoErr, pr, fee, bonusMax, bonusSpend, total, left: Math.max(0, D.freeFrom - sub), belowMin: S.mode === "delivery" && sub < D.minOrder };
}

/* ── cart ops ── */
function add(id, s = 0, x = [], q = 1) {
  const p = P[id]; if (!p.sizes) s = -1;
  const k = lineKey(id, s, x);
  if (S.cart[k]) S.cart[k].q += q; else S.cart[k] = { id, s, x: x.slice(), q };
  save(); cartChanged(true);
}
function setQty(k, q) { if (!S.cart[k]) return; if (q <= 0) delete S.cart[k]; else S.cart[k].q = q; save(); cartChanged(false); }
const simpleKey = id => lineKey(id, P[id].sizes ? 0 : -1, []);
function quickAdd(id) { const p = P[id]; if (hasOptions(p)) { openProduct(id); return false; } add(id, 0, [], 1); refreshCards(id); return true; }

    $$(`[data-ctl="${pid}"]`).forEach(el => { el.innerHTML = cardCtl(p); });

let bannerTimer, spyObs;
function wireMenu() {
  const v = $("#v-menu");
  v.onclick = e => {
    const t = e.target; let b;
    if ((b = t.closest("[data-inc]"))) { e.stopPropagation(); add(b.dataset.inc, 0, [], 1); refreshCards(b.dataset.inc); return; }
    if ((b = t.closest("[data-dec]"))) { e.stopPropagation(); const k = simpleKey(b.dataset.dec); setQty(k, (S.cart[k] ? S.cart[k].q : 0) - 1); refreshCards(b.dataset.dec); return; }
    if ((b = t.closest("[data-add]"))) { e.stopPropagation(); quickAdd(b.dataset.add); return; }
    if ((b = t.closest("[data-open]"))) { openProduct(b.dataset.open); return; }
    if ((b = t.closest("[data-mode]"))) { setMode(b.dataset.mode); return; }
    if ((b = t.closest("[data-story]"))) { openStory(+b.dataset.story); return; }
    if ((b = t.closest("[data-banner]"))) { doAction(C.banners[+b.dataset.banner].action); return; }
    if ((b = t.closest("[data-cat]"))) { scrollToCat(b.dataset.cat); return; }
    if (t.closest("#chatBtn")) { openChat(); return; }
    if (t.closest("#ribbon")) { openPitch(); return; }
    if (t.closest("#liveBtn")) { openTrack(); return; }
  };
  $("#q").addEventListener("input", e => {
    const q = e.target.value.trim().toLowerCase();
    let any = false;
    $$(".section", v).forEach(sec => {
      let n = 0;
      $$(".card", sec).forEach(cd => { const p = P[cd.dataset.open]; const hit = !q || (p.name + " " + p.desc + " " + (CAT[p.cat] ? CAT[p.cat].name : "")).toLowerCase().includes(q); cd.hidden = !hit; if (hit) n++; });
      sec.hidden = n === 0; if (n) any = true;
    });
    $("#noResults").hidden = any;
    ["#stories", "#banners", "#dots"].forEach(s => { $(s).hidden = !!q; });
  });
  const bn = $("#banners"), dots = $$("#dots i");
  let idx = 0, paused = false;
  bn.addEventListener("scroll", () => { const w = bn.firstElementChild.offsetWidth + 10; idx = Math.round(bn.scrollLeft / w); dots.forEach((d, i) => d.classList.toggle("on", i === idx)); }, { passive: true });
  bn.addEventListener("pointerdown", () => { paused = true; });
  bn.addEventListener("pointerup", () => setTimeout(() => { paused = false; }, 4000));
  clearInterval(bannerTimer);
  bannerTimer = setInterval(() => {
    if (paused || S.tab !== "menu" || document.hidden || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const w = bn.firstElementChild.offsetWidth + 10;
    bn.scrollTo({ left: ((idx + 1) % C.banners.length) * w, behavior: "smooth" });
  }, 4500);
  if (spyObs) spyObs.disconnect();
  const chips = $("#chips");
  spyObs = new IntersectionObserver(ents => {
    ents.forEach(en => {
      if (!en.isIntersecting) return;
      const id = en.target.dataset.sec;
      $$(".chip", chips).forEach(c => c.classList.toggle("on", c.dataset.cat === id));
      const on = $(`.chip[data-cat="${id}"]`, chips);
      if (on) chips.scrollTo({ left: on.offsetLeft - 16, behavior: "smooth" });
    });
  }, { root: v, rootMargin: "-80px 0px -65% 0px" });
  $$(".section", v).forEach(s => spyObs.observe(s));
  v.addEventListener("scroll", () => { chips.classList.toggle("stuck", chips.getBoundingClientRect().top - v.getBoundingClientRect().top <= 0.5); }, { passive: true });
}
function scrollToCat(id) {
  if (S.tab !== "menu") setTab("menu");
  const v = $("#v-menu"), sec = $("#sec-" + id); if (!sec) return;
  const q = $("#q"); if (q && q.value) { q.value = ""; q.dispatchEvent(new Event("input")); }
  const top = sec.getBoundingClientRect().top - v.getBoundingClientRect().top + v.scrollTop - $("#chips").offsetHeight + 4;
  v.scrollTo({ top, behavior: "smooth" });
}
function setMode(m) {
  S.mode = m; save();
  $$(".mode").forEach(el => { el.classList.toggle("pickup", m === "pickup"); $$("button", el).forEach(b => b.classList.toggle("on", b.dataset.mode === m)); });

/* ── Sheets ── */
function openSheet(html, { full = false, foot = "", onClose } = {}) {
  const w = document.createElement("div"); w.className = "sheet-wrap";
  w.innerHTML = `<div class="scrim"></div><div class="sheet${full ? " full" : ""}" role="dialog" aria-modal="true"><div class="grab"></div><button class="x" aria-label="Закрыть">${ic("x")}</button><div class="sheet-body">${html}</div>${foot ? `<div class="sheet-foot">${foot}</div>` : ""}</div>`;
  layer.appendChild(w);
  requestAnimationFrame(() => requestAnimationFrame(() => w.classList.add("open")));
  const sh = $(".sheet", w);
  const close = () => { if (w._closing) return; w._closing = true; w.classList.remove("open"); sh.style.transform = ""; setTimeout(() => { w.remove(); onClose && onClose(); }, 380); };
  $(".scrim", w).onclick = close; $(".x", w).onclick = close;
  const g = $(".grab", w); let y0 = null, dy = 0;
  g.addEventListener("pointerdown", e => { y0 = e.clientY; dy = 0; sh.style.transition = "none"; g.setPointerCapture(e.pointerId); });
  g.addEventListener("pointermove", e => { if (y0 == null) return; dy = Math.max(0, e.clientY - y0); sh.style.transform = `translateY(${dy}px)`; });
  const end = () => { if (y0 == null) return; y0 = null; sh.style.transition = ""; if (dy > 110) close(); else sh.style.transform = ""; };
  g.addEventListener("pointerup", end); g.addEventListener("pointercancel", end);
  w.close = close;
  return w;
}

/* ── Product sheet ── */
function openProduct(id) {
  const p = P[id]; const ex = extrasOf(p);
  let s = 0, x = [], q = 1;
  const price = () => ((p.sizes ? p.sizes[s].price : p.price) + x.reduce((a, i) => a + ex[i].price, 0)) * q;
  const meta = () => [p.sizes ? p.sizes[s].weight : p.weight].filter(Boolean).join(" · ");
  const html = `${photo(p, "p-hero")}
    <div class="p-body">
      <h2>${esc(p.name)}</h2>
      <div class="p-meta" id="pm">${esc(meta())}</div>
      <p>${esc(p.desc)}</p>
      ${p.sizes && p.sizes.length > 1 ? `<div class="seg" id="seg">${p.sizes.map((z, i) => `<button data-s="${i}" class="${i === s ? "on" : ""}">${esc(z.name)}</button>`).join("")}</div>` : ""}
      ${ex.length ? `<div><div class="p-meta" style="margin:6px 0 2px">Добавить</div>${ex.map((e, i) => `<button class="extra" data-x="${i}"><span class="bx">${ic("check")}</span>${esc(e.name)}<span class="xp num">${e.price ? "+" + rub(e.price) : "бесплатно"}</span></button>`).join("")}</div>` : ""}
      ${p.kbju ? `<div class="kbju">${esc(p.kbju)}</div>` : ""}
    </div>`;
  const foot = `<div class="stepper light lg"><button data-q="-1" aria-label="Меньше">${ic("minus")}</button><span class="num" id="pq">1</span><button data-q="1" aria-label="Больше">${ic("plus")}</button></div><button class="cta" id="padd">Добавить · <span class="num" id="pp"></span></button>`;
  const w = openSheet(html, { foot });
  const upd = () => { $("#pp", w).textContent = rub(price()); $("#pq", w).textContent = q; $("#pm", w).textContent = meta(); };
  upd();
  w.addEventListener("click", e => {
    let b;
    if ((b = e.target.closest("[data-s]"))) { s = +b.dataset.s; $$("[data-s]", w).forEach(z => z.classList.toggle("on", z === b)); upd(); }
    else if ((b = e.target.closest("[data-x]"))) { const i = +b.dataset.x; x = x.includes(i) ? x.filter(z => z !== i) : [...x, i]; b.classList.toggle("on"); upd(); }
    else if ((b = e.target.closest("[data-q]"))) { q = Math.max(1, Math.min(20, q + +b.dataset.q)); upd(); }
    else if (e.target.closest("#padd")) { add(id, s, x, q); refreshCards(id); toast("Добавлено: " + p.name); w.close(); }
  });

/* ── Checkout ── */
function fmtPhone(v) {
  let d = v.replace(/\D/g, ""); if (d.startsWith("8")) d = "7" + d.slice(1); if (!d.startsWith("7")) d = "7" + d; d = d.slice(0, 11);
  const p = [d.slice(1, 4), d.slice(4, 7), d.slice(7, 9), d.slice(9, 11)];
  let s = "+7"; if (p[0]) s += " (" + p[0]; if (p[0].length === 3) s += ")"; if (p[1]) s += " " + p[1]; if (p[2]) s += "-" + p[2]; if (p[3]) s += "-" + p[3];
  return s;
}
function openCheckout() {
  const t = totals(), f = S.form, del = S.mode === "delivery";
  const slots = []; const now = new Date(); now.setMinutes(Math.ceil(now.getMinutes() / 30) * 30 + 60, 0, 0);
  for (let i = 0; i < 6; i++) slots.push(new Date(now.getTime() + i * 30 * 60000).toTimeString().slice(0, 5));
  const pays = del ? ["Картой курьеру", "Наличными", "Переводом по СБП"] : ["Картой при получении", "Наличными", "Переводом по СБП"];

    <div class="fl"><label for="coName">Имя</label><input id="coName" autocomplete="given-name" value="${esc(f.name || "")}" placeholder="Как к вам обращаться"></div>
    <div class="fl"><label for="coPhone">Телефон</label><input id="coPhone" type="tel" inputmode="tel" autocomplete="tel" value="${esc(f.phone || "")}" placeholder="+7 (___) ___-__-__"></div>
    ${del ? `<div class="fl"><label for="coAddr">Улица и дом</label><input id="coAddr" autocomplete="street-address" value="${esc(f.addr || "")}" placeholder="Например, ул. Мира, 15"></div>
    <div class="two"><div class="fl"><label for="coFlat">Квартира</label><input id="coFlat" value="${esc(f.flat || "")}" inputmode="numeric"></div><div class="fl"><label for="coEnt">Подъезд, этаж</label><input id="coEnt" value="${esc(f.ent || "")}"></div></div>`
    : `<div class="pickup-box">${ic("pin")}<span>${esc(C.contacts.address)}<small>${esc(C.contacts.addressNote || "Будет готово через 20 минут")}</small></span></div>`}
    <div class="fl"><label for="coTime">Когда</label><select id="coTime"><option value="">Как можно скорее · ${del ? esc(D.time) : "20 мин"}</option>${slots.map(s => `<option value="${s}">Ко времени · ${s}</option>`).join("")}</select></div>
    <div class="fl"><span class="lbl">Оплата</span><div class="pays">${pays.map((x, i) => `<button type="button" class="extra radio${i === (f.pay || 0) ? " on" : ""}" data-pay="${i}"><span class="bx">${ic("check")}</span>${x}</button>`).join("")}</div></div>
    <div class="fl"><label for="coNote">Комментарий</label><textarea id="coNote" placeholder="Позвонить заранее, приборы на двоих…"></textarea></div>
  </form>`;
  const w = openSheet(html, { full: true, foot: `<button class="cta" id="coSend">Подтвердить заказ · <span class="num">${rub(t.total)}</span></button>` });
  let pay = f.pay || 0;
  const ph = $("#coPhone", w);
  ph.addEventListener("input", () => { ph.value = fmtPhone(ph.value); });
  ph.addEventListener("focus", () => { if (!ph.value) ph.value = "+7 ("; });
  w.addEventListener("click", e => {
    const b = e.target.closest("[data-pay]"); if (b) { pay = +b.dataset.pay; $$("[data-pay]", w).forEach(z => z.classList.toggle("on", z === b)); }
    if (e.target.closest("#coSend")) submit();
  });
  $("#coForm", w).addEventListener("submit", e => { e.preventDefault(); submit(); });
  function submit() {
    const name = $("#coName", w), addr = $("#coAddr", w);
    let ok = true;
    [[name, name.value.trim().length >= 2], [ph, ph.value.replace(/\D/g, "").length === 11], [addr, !addr || addr.value.trim().length >= 4]].forEach(([el, good]) => { if (!el) return; el.parentElement.classList.toggle("bad", !good); if (!good) ok = false; });
    if (!ok) { toast("Проверьте выделенные поля"); return; }
    S.form = { name: name.value.trim(), phone: ph.value, addr: addr ? addr.value.trim() : f.addr, flat: $("#coFlat", w) ? $("#coFlat", w).value : f.flat, ent: $("#coEnt", w) ? $("#coEnt", w).value : f.ent, pay };
    const tt = totals();
    const slot = $("#coTime", w).value;
    const mins = del ? (D.minutes || 45) : 20;
    const eta = slot || new Date(Date.now() + mins * 60000).toTimeString().slice(0, 5);
    const earned = Math.round(tt.total * level().percent / 100);
    S.order = { num: 1000 + Math.floor(Math.random() * 9000), created: Date.now(), total: tt.total, eta, earned, credited: false, mode: S.mode, count: tt.count };
    S.bonus -= tt.bonusSpend; S.spent += tt.total;
    S.cart = {}; S.promo = null; S.useBonus = false; save();
    w.close();
    cartChanged(false); refreshCards(); setTab("menu"); renderMenu();
    setTimeout(openTrack, 250);
  }
}

/* ── Tracking ── */
const STAGE_MS = 7000; // demo speed
const orderStage = o => Math.min(3, Math.floor((Date.now() - o.created) / STAGE_MS));
const stagesFor = o => o.mode === "pickup"
  ? [{ title: "Заказ принят", sub: "Кафе получило заказ" }, { title: "Готовим", sub: "Повар уже взялся за дело" }, { title: "Можно забирать", sub: C.contacts.address }, { title: "Выдан", sub: "Приятного аппетита" }]
  : [{ title: "Заказ принят", sub: "Кафе получило заказ" }, { title: "Готовим", sub: "Повар уже взялся за дело" }, { title: "Курьер в пути", sub: "Едет к вам" }, { title: "Доставлен", sub: "Приятного аппетита" }];
let trackTimer;
function openTrack() {
  const o = S.order; if (!o) return;
  const el = document.createElement("div"); el.className = "track";
  layer.appendChild(el);
  const stages = stagesFor(o);
  const draw = () => {
    const st = orderStage(o), s = stages[st];
    el.innerHTML = `<div class="pad" style="display:flex;align-items:center;gap:12px;padding-top:12px"><button class="iconbtn" id="tClose" aria-label="Закрыть">${ic("x")}</button><span style="font-weight:500">Заказ №${o.num}</span></div>
      <div class="body pad">

        <p class="eta">${st < 3 ? (o.mode === "pickup" ? "Будет готово к " : "Привезём к ") + o.eta : "Спасибо, что выбрали " + esc(C.brand.name)}</p>
        <div class="block">${stages.map((x, i) => `<div class="st ${i < st || st === 3 ? "done" : i === st ? "now" : ""}"><span class="d">${i < st || st === 3 ? ic("check") : ""}</span><span><b>${esc(x.title)}</b><small>${esc(x.sub)}</small></span></div>`).join("")}</div>
        <div class="block" style="margin-top:10px">
          <div class="sum-row"><span>${o.count} ${plural(o.count, "товар", "товара", "товаров")}</span><b class="num">${rub(o.total)}</b></div>
          <div class="sum-row"><span>Начислим бонусов</span><b class="num">+${o.earned}</b></div>
        </div>
        ${st === 3 ? `<div style="margin-top:14px"><button class="cta" id="tAgain">Заказать ещё</button></div>` : `<div class="block" style="margin-top:10px;padding-top:0;padding-bottom:0"><div class="list-row"><span class="ico">${ic("phone")}</span><span><b>Вопрос по заказу?</b><small style="user-select:all">${esc(C.contacts.phone)}</small></span></div></div>`}
        <p class="note">Демо: статусы меняются быстрее, чем в жизни</p>
      </div>`;
    if (st === 3) creditOrder();
    $("#tClose", el).onclick = close;
    const again = $("#tAgain", el); if (again) again.onclick = () => { close(); setTab("menu"); };
  };
  let last = -1;
  const tick = () => { const st = orderStage(o); if (st !== last) { last = st; draw(); const lw = $("#liveWrap"); if (lw) lw.innerHTML = liveStrip(); } if (st >= 3) clearInterval(trackTimer); };
  function close() { clearInterval(trackTimer); el.classList.remove("open"); setTimeout(() => el.remove(), 450); const lw = $("#liveWrap"); if (lw) lw.innerHTML = liveStrip(); }
  tick(); clearInterval(trackTimer); trackTimer = setInterval(tick, 500);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("open")));
}
function creditOrder() {
  const o = S.order; if (!o || o.credited || orderStage(o) < 3) return;

    body = `<ol>
      <li><span class="n">1</span><span>Нажмите ${ic("share")} «Поделиться» внизу экрана</span></li>
      <li><span class="n">2</span><span>Выберите ${ic("addsq")} «На экран „Домой“»</span></li>
      <li><span class="n">3</span><span>Нажмите «Добавить» в правом верхнем углу</span></li>
    </ol><p class="hint">Открыли из WhatsApp или Telegram? Сначала нажмите «Открыть в Safari».</p>`;
    foot = `<button class="cta" id="instOk">Понятно</button>`;
  } else {
    body = `<ol>
      <li><span class="n">1</span><span>Откройте меню браузера ${ic("dots")}</span></li>
      <li><span class="n">2</span><span>Выберите «Установить приложение» или «Добавить на главный экран»</span></li>
    </ol><p class="hint">Открыли из мессенджера? Сначала откройте ссылку в Chrome.</p>`;
    foot = `<button class="cta" id="instOk">Понятно</button>`;
  }
  const remember = () => { if (auto) try { localStorage.setItem("install-later:" + C.brand.id, String(Date.now())); } catch (e) {} };
  const w = openSheet(`<div class="inst">${head}${body}</div>`, { foot, onClose: remember });
  w.addEventListener("click", async e => {
    if (e.target.closest("#instOk")) w.close();
    if (e.target.closest("#instGo") && installPrompt) {
      const p = installPrompt; installPrompt = null;
      try { await p.prompt(); await p.userChoice; } catch (err) {}
      w.close();
    }
  });
}
function offerInstall() {
  if (!C.pwa || isStandalone() || !isPhoneWidth()) return;
  let last = 0; try { last = +localStorage.getItem("install-later:" + C.brand.id) || 0; } catch (e) {}
  if (Date.now() - last < 3 * 864e5) return;   // asked in the last 3 days
  setTimeout(() => { if (!layer.children.length) openInstall(true); }, 3500);
}
function openPitch() { openSheet(`<div class="pitch-sheet pitch">${pitchHTML(true)}</div>`); }

/* ── Stories ── */
function openStory(i) {
  const el = document.createElement("div"); el.className = "sheet-wrap open";
  layer.appendChild(el);
  let cur = i;
  const close = () => { el.remove(); $$("[data-story]").forEach(b => b.classList.toggle("seen", S.seen.includes(+b.dataset.story))); };
  const show = () => {
    if (cur < 0) cur = 0;
    if (cur >= C.stories.length) { close(); return; }
    const s = C.stories[cur], src = imgOf(s.img);
    if (!S.seen.includes(cur)) { S.seen.push(cur); save(); }
    el.innerHTML = `<div class="sv">
      <div class="top-ui">
        <div class="bars">${C.stories.map((_, k) => `<i class="${k < cur ? "done" : k === cur ? "run" : ""}"><b></b></i>`).join("")}</div>
        <div class="hd">${monoHTML()}${esc(C.brand.name)}<button aria-label="Закрыть" id="svX">${ic("x")}</button></div>
      </div>
      <div class="media">${src ? `<img src="${esc(src)}" alt="">` : ""}</div>
      <button class="tapl" aria-label="Назад"></button><button class="tapr" aria-label="Дальше"></button>
      <div class="txt"><h2>${esc(s.title)}</h2><p>${esc(s.text)}</p>${s.button ? `<button class="cta" id="svGo">${esc(s.button)}</button>` : ""}</div>
    </div>`;
    $(".bars .run b", el).addEventListener("animationend", () => { cur++; show(); });
    $("#svX", el).onclick = close;
    $(".tapl", el).onclick = () => { cur--; show(); };
    $(".tapr", el).onclick = () => { cur++; show(); };
    const go = $("#svGo", el); if (go) go.onclick = () => { close(); doAction(s.action); };
  };
  show();
}

/* ── Actions from banners / stories ── */
function doAction(a) {
  if (!a) return;
  if (a.type === "cat") scrollToCat(a.id);
  else if (a.type === "product" && P[a.id]) openProduct(a.id);
  else if (a.type === "tab") setTab(a.id);
  else if (a.type === "promo") applyPromo(a.code, true);
}

/* ── Assistant chat ── */
let chatLog = null;
function openChat() {
  const A = C.assistant;
  const html = `<div class="chat">
    <div class="hd">${monoHTML()}<span><b>${esc(A.name)}</b><small>Отвечает сразу</small></span></div>
    <div class="msgs" id="msgs"></div>
    <div class="quick">${A.quick.map(q => `<button data-qq="${esc(q)}">${esc(q)}</button>`).join("")}</div>
    <form class="compose" id="compose"><input id="chatIn" placeholder="Напишите вопрос" autocomplete="off"><button aria-label="Отправить">${ic("send")}</button></form>
  </div>`;
  const w = openSheet(html, { full: true });
  $(".sheet-body", w).style.overflow = "hidden";
  const box = $("#msgs", w);
  const push = (h, cls) => { const d = document.createElement("div"); d.className = cls; d.innerHTML = h; box.appendChild(d); box.scrollTop = box.scrollHeight; return d; };
  if (!chatLog) chatLog = [{ who: "bot", text: A.greeting }];
  chatLog.forEach(m => m.cards ? push(m.cards, "msg-cards") : push(esc(m.text), "msg " + m.who));
  const findProducts = spec => {
    if (!spec) return [];
    const [kind, val] = spec.split(":");
    if (kind === "tag") return C.products.filter(p => (p.tags || []).includes(val)).slice(0, 6);
    if (kind === "id") return val.split(",").map(id => P[id]).filter(Boolean);
    if (kind === "cat") return C.products.filter(p => p.cat === val).slice(0, 6);
    return [];
  };
  const answer = q => {
    const s = q.toLowerCase();
    const hit = A.faq.find(f => f.keys.some(k => s.includes(k)));
    if (!hit) {
      const cat = C.categories.find(c => s.includes(c.name.toLowerCase().slice(0, 4)));
      if (cat) return { a: "Вот что есть в разделе «" + cat.name + "»:", products: "cat:" + cat.id };
    }
    return hit || { a: A.fallback };
  };
  const ask = q => {
    q = q.trim(); if (!q) return;
    chatLog.push({ who: "me", text: q }); push(esc(q), "msg me");
    const typing = push("<i></i><i></i><i></i>", "msg bot typing");
    const r = answer(q);
    setTimeout(() => {
      typing.remove();
      chatLog.push({ who: "bot", text: r.a }); push(esc(r.a), "msg bot");
      const ps = findProducts(r.products);
      if (ps.length) {
        const cards = ps.map(p => `<div class="mini">${photo(p)}<div class="mb"><b>${esc(p.name)}</b><button class="addbtn num" data-cadd="${p.id}">${p.sizes && p.sizes.length > 1 ? "от " : "+ "}${rub(basePrice(p))}</button></div></div>`).join("");
        chatLog.push({ cards }); push(cards, "msg-cards");
      }
    }, 600 + Math.min(900, r.a.length * 8));
  };
  w.addEventListener("click", e => {
    let b;
    if ((b = e.target.closest("[data-qq]"))) ask(b.dataset.qq);
    if ((b = e.target.closest("[data-cadd]"))) { if (quickAdd(b.dataset.cadd)) toast("Добавлено: " + P[b.dataset.cadd].name); }
  });
  $("#compose", w).addEventListener("submit", e => { e.preventDefault(); const i = $("#chatIn", w); ask(i.value); i.value = ""; });
}

/* ── Clock in the fake status bar ── */
const tickClock = () => { const n = new Date(); $("#clock").textContent = n.getHours() + ":" + String(n.getMinutes()).padStart(2, "0"); };
tickClock(); setInterval(tickClock, 15000);

/* ── Boot ── */
$("#splashMono").outerHTML = monoHTML("mono");
$("#splashName").textContent = C.brand.name; $("#splashTag").textContent = C.brand.tagline;
renderMenu(); renderPromo(); updatePill();
setTimeout(() => $("#splash").classList.add("gone"), matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 900);
offerInstall();
setInterval(() => { if (!S.order) return; creditOrder(); const lw = $("#liveWrap"); if (lw) lw.innerHTML = liveStrip(); }, 2000);
})();
</script>
